(function(){
const K='cp_hero_min';
function sv(v){try{sessionStorage.setItem(K,v?'1':'0')}catch(e){}}
function ld(){try{return sessionStorage.getItem(K)==='1'}catch(e){return false}}
function set(h,m){h.classList.toggle('hx-min',m);const c=h.querySelector('.hxfh-t'),p=h.querySelector('.hx-pill'),b=h.querySelector('.hx-mn');
 if(c)c.setAttribute('aria-hidden',m?'true':'false');if(c)c.inert=m;if(p){p.hidden=!m}if(b)b.setAttribute('aria-expanded',String(!m))}
function build(){

 const c=h.querySelector('.hxfh-t');if(!c)return;
 c.insertAdjacentHTML('afterbegin','<button type="button" class="hx-mn" aria-label="Minimise this panel to see the photograph" aria-expanded="true" title="Minimise"><span aria-hidden="true">–</span></button>');

 h.addEventListener('click',e=>{if(e.target.closest('.hx-mn')){set(h,true);sv(true)}else if(e.target.closest('.hx-ex')){set(h,false);sv(false)}});
 set(h,ld());

(function(){
const U='https://www.crownpavilions.com/videos/5097a64095c2522611bebce8e9cc978a/video.m3u8';
const ok=()=>!matchMedia('(prefers-reduced-motion:reduce)').matches&&innerWidth>=700&&!(navigator.connection&&navigator.connection.saveData);
function mount(){
 const box=document.querySelector('.hxfh-i');if(!box||box.dataset.hv)return;box.dataset.hv=1;
 if(!ok())return;
 const v=document.createElement('video');v.className='hvx';v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('aria-hidden','true');v.tabIndex=-1;v.preload='none';
 const b=document.createElement('button');b.type='button';b.className='hvxb';b.textContent='Pause';b.setAttribute('aria-label','Pause hero video');b.hidden=true;
 box.appendChild(v);box.appendChild(b);
 let on=false;const show=()=>{if(on)return;on=true;v.classList.add('on');b.hidden=false};
 v.addEventListener('playing',show);
 b.onclick=()=>{if(v.paused){v.play();b.textContent='Pause'}else{v.pause();b.textContent='Play'}};
 const go=()=>{
  if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=U;v.play().catch(()=>{})}
  else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
   s.onload=()=>{if(window.Hls&&Hls.isSupported()){const h=new Hls({capLevelToPlayerSize:true,startLevel:-1});h.loadSource(U);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){h.destroy();v.classList.remove('on');b.hidden=true}})}};
   s.onerror=()=>{};document.head.appendChild(s)}};
 if('IntersectionObserver'in window){let started=false;new IntersectionObserver(es=>{const vis=es[0].isIntersecting;if(vis&&!started){started=true;go()}else if(started&&b.textContent==='Pause'){vis?v.play().catch(()=>{}):v.pause()}},{threshold:.25}).observe(box)}else go();
}
let t;const mo=new MutationObserver(()=>{clearTimeout(t);t=setTimeout(()=>{mo.disconnect();try{mount()}finally{mo.observe(document.body,{childList:true,subtree:true})}},30)});
mo.observe(document.body,{childList:true,subtree:true});addEventListener('hashchange',()=>setTimeout(mount,60));mount();
})();
